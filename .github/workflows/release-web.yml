name: Release web

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  migrate:
    name: Migrate production database
    needs: verify
    runs-on: ubuntu-latest
    environment: production-release
    env:
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - name: Configure migration CA certificate
        env:
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
        run: |
          if [ -z "$DATABASE_SSL_CA" ]; then
            echo "::error::DATABASE_SSL_CA is not configured in the production-release environment."
            exit 1
          fi
          umask 077
          migration_ca_file="$(mktemp "$RUNNER_TEMP/upto-migration-ca.XXXXXX")"
          printf '%s\n' "$DATABASE_SSL_CA" > "$migration_ca_file"
          if ! openssl x509 -in "$migration_ca_file" -noout > /dev/null 2>&1; then
            echo "::error::DATABASE_SSL_CA must contain a PEM-encoded CA certificate."
            exit 1
          fi
          printf 'NODE_EXTRA_CA_CERTS=%s\n' "$migration_ca_file" >> "$GITHUB_ENV"
      - name: Check migration connection
        run: pnpm --filter @upto/db db:diagnose-migration
      - name: Apply database migrations
        id: apply_migrations
        continue-on-error: true
        run: pnpm --filter @upto/db db:migrate
      - name: Report migration failure
        if: steps.apply_migrations.outcome == 'failure'
        run: |
          echo "::error title=Supabase migration failed::Drizzle Kit exited unsuccessfully. Review the Apply database migrations step above for the migration error."
          pnpm --filter @upto/db db:diagnose-migration || true
          exit 1

  deploy:
    name: Deploy web to production
    needs: migrate
    runs-on: ubuntu-latest
    environment: production-release
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
      - name: Deploy apps/web to production
        # Run from the repository root; the Vercel project sets Root Directory to apps/web.
        run: pnpm dlx vercel@59.15.0 deploy --prod --yes --logs --token "$VERCEL_TOKEN"
