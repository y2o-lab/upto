name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Unit and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.9

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    name: Web E2E
    uses: ./.github/workflows/web-e2e.yml

  verify:
    if: ${{ always() }}
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require unit checks and E2E success
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$CHECKS_RESULT" = success && test "$E2E_RESULT" = success
