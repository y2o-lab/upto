name: Web E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Compare desktop and mobile screenshots in the fixed Linux environment
        run: sh apps/web/e2e/visual/run.sh
      - name: Upload visual comparison report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/visual/
            test-results/visual/
          retention-days: 7
          if-no-files-found: ignore

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.7

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop and mobile E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
