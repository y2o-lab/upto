name: Terraform

on:
  pull_request:
    branches:
      - release-infra
    paths:
      - ".github/workflows/terraform.yml"
      - "infra/**"
  push:
    branches:
      - release-infra
    paths:
      - ".github/workflows/terraform.yml"
      - "infra/**"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run against production infrastructure"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cloudflare_zone_id: ${{ vars.TF_CLOUDFLARE_ZONE_ID }}
  TF_VAR_vercel_project_name: ${{ vars.TF_VERCEL_PROJECT_NAME }}
  TF_VAR_vercel_team_id: ${{ vars.TF_VERCEL_TEAM_ID }}
  TF_VAR_vercel_git_repository: ${{ vars.TF_VERCEL_GIT_REPOSITORY }}
  TF_VAR_vercel_production_branch: ${{ vars.TF_VERCEL_PRODUCTION_BRANCH }}
  TF_VAR_vercel_domains: ${{ vars.TF_VERCEL_DOMAINS_JSON }}
  TF_VAR_verification_dns_records: ${{ vars.TF_VERIFICATION_DNS_RECORDS_JSON || '{}' }}

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize production providers without state access
        run: terraform -chdir=infra/environments/production init -backend=false

      - name: Validate production configuration
        run: terraform -chdir=infra/environments/production validate

  plan:
    name: Plan production
    needs: validate
    # Fork pull requests run validation only. Plans with production credentials
    # are restricted to reviewed, same-repository pull requests and release-infra.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/release-infra') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release-infra')
    runs-on: ubuntu-latest
    environment: terraform-production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Initialize remote state
        run: terraform -chdir=infra/environments/production init

      - name: Plan
        run: terraform -chdir=infra/environments/production plan -no-color

  apply:
    name: Apply production
    needs: plan
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/release-infra') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release-infra' && inputs.operation == 'apply')
    runs-on: ubuntu-latest
    environment: terraform-production
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Initialize remote state
        run: terraform -chdir=infra/environments/production init

      - name: Apply
        run: terraform -chdir=infra/environments/production apply -auto-approve -no-color
